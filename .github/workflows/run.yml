name: Run Stock Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # Comando que agenda a execução a cada 5 minutos
  workflow_dispatch: # Permite que você clique em um botão para testar manualmente

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Execute Monitor Script
        run: node stock_monitor.js
