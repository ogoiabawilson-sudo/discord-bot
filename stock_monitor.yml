name: Stock Monitor

on:
  schedule:
    - cron: '0 */5 * * *'   # a cada 5 horas (GitHub não suporta menos de 5min no cron)
  workflow_dispatch:         # permite rodar manualmente

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360     # 6h de timeout máximo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore message ID cache
        uses: actions/cache@v4
        with:
          path: message_id.txt
          key: discord-message-id-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: npm install

      - name: Run stock monitor
        env:
          SELLAUTH_API_KEY: ${{ secrets.SELLAUTH_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node stock_monitor.js

      - name: Save message ID cache
        if: always()
        uses: actions/cache@v4
        with:
          path: message_id.txt
          key: discord-message-id-v1
